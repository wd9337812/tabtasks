<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabTasks</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div id="app">
    <header class="bar">
      <div class="brand">
        <span class="logo"></span>
        <strong>TabTasks</strong>
      </div>
      <div class="bar-right">
        <span id="planBadge" class="plan plan-free">FREE</span>
        <button id="btnUpgrade" class="icon-btn" title="Pro / Settings">⚙</button>
      </div>
    </header>

    <section class="capture">
      <button id="btnCapture" class="capture-btn" title="把当前页面收集为任务">
        <span class="plus">＋</span> 收集当前页面
      </button>
      <input id="quickAdd" class="quick-add" type="text"
             placeholder="快速添加任务，回车保存…" />
    </section>

    <nav id="listTabs" class="list-tabs"></nav>

    <main id="taskList" class="task-list"></main>

    <footer class="foot">
      <span id="counter">0 项</span>
      <div class="foot-actions">
        <button id="btnExport" class="link-btn">导出</button>
        <button id="btnImport" class="link-btn">导入</button>
        <input type="file" id="fileImport" accept=".json,application/json" hidden />
        <button id="btnIcs" class="link-btn">导出日程</button>
        <button id="btnClearDone" class="link-btn">清除已完成</button>
      </div>
    </footer>
  </div>

  <!-- 升级 / 设置抽屉 -->
  <div id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <h3>TabTasks Pro</h3>
      <button id="btnCloseDrawer" class="icon-btn">✕</button>
    </div>
    <div class="drawer-body">
      <ul class="pro-points">
        <li>无限活动任务 &amp; 无限列表</li>
        <li>任务标签分类</li>
        <li>抓取页面正文摘要</li>
        <li>一键导出 / 导入备份</li>
        <li>AI 助手：自然语言增删改任务（自带 Key）</li>
      </ul>

      <div class="price-card">
        <div class="price">
          <span class="amount">$6</span>
          <span class="per">一次性买断 · 全平台</span>
        </div>
        <a id="btnBuy" class="buy-btn" href="#" target="_blank" rel="noopener">购买 Pro</a>
        <p class="buy-note">付款后你会收到 License Key，粘贴到下方即可解锁。</p>
      </div>

      <div class="activate">
        <label>已有 License Key？</label>
        <textarea id="licenseInput" placeholder="PRO·xxxx.yyyy 粘贴到这里"></textarea>
        <div class="activate-row">
          <button id="btnActivate" class="buy-btn ghost">激活</button>
          <button id="btnDeactivate" class="link-btn">解除本设备</button>
        </div>
        <p id="licStatus" class="lic-status"></p>
      </div>

      <div class="ai-box">
        <h4>AI 助手（自带 OpenAI Key）</h4>
        <p class="ai-note">Key 只存本机 chrome.storage.local，仅直连 api.openai.com，本扩展不代收不上传；不填即不用。</p>
        <div class="activate-row">
          <input id="aiKey" type="password" placeholder="sk-… 不启用可留空" />
          <input id="aiModel" type="text" value="gpt-4o-mini" title="模型名" />
          <button id="btnAiSave" class="link-btn">保存</button>
        </div>
        <textarea id="aiChat" placeholder="例：把带「竞品」标签的任务都标完成；加一个周五前写周报的任务"></textarea>
        <div class="activate-row">
          <button id="btnAiSend" class="buy-btn ghost">生成操作</button>
          <button id="btnAiApply" class="buy-btn" disabled>应用以上操作</button>
        </div>
        <div id="aiOps" class="ai-ops"></div>
        <p id="aiStatus" class="lic-status"></p>
      </div>

      <div class="lists-admin">
        <h4>列表</h4>
        <div id="adminLists"></div>
        <button id="btnAddList" class="link-btn">＋ 新建列表</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="preview.js"></script>
  <script src="data.js"></script>
  <script src="config.js"></script>
  <script src="license.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
