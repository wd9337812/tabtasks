# Billing v2: server-created Stripe Checkout + isolated D1 orders.
# Keep LIC_SECRET / STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / ADMIN_TOKEN in Worker secrets.
name = "tabtasks-pro-api"
main = "index.js"
compatibility_date = "2026-10-09"

workers_dev = true
routes = [{ pattern = "pay-tabtasks.tabplugins.top", custom_domain = true }]

[vars]
EXTENSION_ID = "oloegbmgmcklmfgcmjngkjdfciblkmkp"
PRODUCT_SLUG = "tabtasks"
PRODUCT_NAME = "TabTasks Pro"
PUBLIC_ORIGIN = "https://pay-tabtasks.tabplugins.top"
SITE_ORIGIN = "https://tabtasks.tabplugins.top"
CHECKOUT_MODE = "api"
ALLOW_TEST_PAYMENTS = "false"
ENABLE_PROVISIONING = "false"
STRIPE_PRICE_ID = "price_1UJzCtBV2lNTC4WNZO43TKhw"
# Retained only for validating existing Payment Link orders and manual fallback.
STRIPE_PAYMENT_LINK = "https://buy.stripe.com/fZu8wOapx9qc4z27FNbwk00"
EXPECTED_PAYMENT_LINK_ID = "plink_1UJzDLBV2lNTC4WNYlEvmfVC"
STRIPE_WEBHOOK_ID = "we_1UN8raBV2lNTC4WNNY8sfyQT"
ALLOW_PROMOTION_CODES = "false"
AUTOMATIC_TAX = "true"

[[d1_databases]]
binding = "ORDERS_DB"
database_name = "tabtasks-pro-orders"
database_id = "cb608c26-bfac-43d9-9caa-91143cd59520"
